<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دفتر المزرعة</title>
<meta name="theme-color" content="#2A1F17">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--sand:#F3EADB;--paper:#FBF6EC;--ink:#2A1F17;--muted:#7C6A58;--line:#E0D2BD;--acc:#C4562B;--acc-fg:#fff;--gold:#D9A441;--olive:#5F7A3A;--dark:#2A1F17;--dark-fg:#F3EADB;--bad:#B3261E;--r:14px}
@media (prefers-color-scheme:dark){:root{--sand:#1B1510;--paper:#271F17;--ink:#F3EADB;--muted:#B7A590;--line:#42372B;--dark:#0F0B08;--acc:#E0733F;--olive:#9DBB6B;--bad:#F2877E}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--sand);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,Tahoma,sans-serif;font-size:16px;line-height:1.5;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:"Reem Kufi","IBM Plex Sans Arabic",sans-serif;margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-height:46px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.muted{color:var(--muted)} .small{font-size:13.5px}

/* hero */
.hero{background:var(--dark);color:var(--dark-fg);padding:18px 0 26px;border-radius:0 0 30px 30px}
.hero .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hero h1{font-size:26px}
.hero .who{font-size:13px;opacity:.7}
.bellb{position:relative;width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.1);font-size:20px}
.bellb i{position:absolute;top:-5px;inset-inline-start:-5px;background:var(--acc);color:#fff;font-size:11px;font-style:normal;min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center;padding:0 4px}
.datebar{display:flex;gap:10px;align-items:center;margin-top:16px}
.datebar input{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:var(--dark-fg);color-scheme:dark}
.saved{font-size:13px;color:var(--gold);min-width:68px}
.shift{display:grid;grid-template-columns:1fr 1fr;margin-top:14px;background:rgba(255,255,255,.08);border-radius:12px;padding:4px}
.shift button{padding:10px;border-radius:9px;font-weight:600;opacity:.8}
.shift button[aria-pressed="true"]{background:var(--dark-fg);color:var(--dark);opacity:1}
.sum{display:flex;align-items:center;gap:18px;margin-top:20px}
.ring{--p:0;width:96px;height:96px;flex:none;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p)*1%),rgba(255,255,255,.14) 0);display:grid;place-items:center;position:relative}
.ring::before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--dark)}
.ring b{position:relative;font-family:"Reem Kufi",sans-serif;font-size:20px}
.sum .big{font-family:"Reem Kufi",sans-serif;font-size:42px;line-height:1}
.sum .lbl{font-size:13.5px;opacity:.75}
.sum .mini{display:flex;gap:16px;margin-top:8px;font-size:13.5px}
.sum .mini b{display:block;font-size:17px}

/* grid */
.sec-t{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 10px}
.sec-t h2{font-size:21px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hc{background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r);padding:14px;text-align:start;position:relative;overflow:hidden}
.hc .n{font-family:"Reem Kufi",sans-serif;font-size:46px;line-height:1;color:var(--acc)}
.hc .nm{font-size:12.5px;color:var(--muted);margin-top:2px}
.hc .tr{font-weight:700;font-size:19px;margin-top:8px}
.hc .tr small{font-weight:400;color:var(--muted);font-size:13px}
.hc .pb{height:6px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}
.hc .pb i{display:block;height:100%;background:var(--olive);width:0}
.hc.empty .n{color:var(--line)}
.hc::after{content:"";position:absolute;top:0;inset-inline-end:0;width:0;height:0;border-style:solid;border-width:0 26px 26px 0;border-color:transparent var(--gold) transparent transparent;opacity:0}
.hc.has::after{opacity:1}

/* sheet */
.sheet{position:fixed;inset:0;z-index:30;background:var(--sand);overflow-y:auto;padding-bottom:150px}
.shead{position:sticky;top:0;z-index:2;background:var(--dark);color:var(--dark-fg);padding:12px 16px;display:flex;align-items:center;gap:12px}
.shead .back{padding:8px 14px;border-radius:10px;background:rgba(255,255,255,.12);font-weight:600}
.shead h2{font-size:22px;flex:1}
.stabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1.5px solid var(--line);margin:0 -16px;background:var(--paper)}
.stabs button{padding:14px;font-weight:600;color:var(--muted);border-bottom:4px solid transparent}
.stabs button[aria-pressed="true"]{color:var(--acc);border-bottom-color:var(--acc)}
.box{background:var(--paper);border:1.5px solid var(--line);border-inline-start:6px solid var(--gold);border-radius:var(--r);padding:14px;margin:14px 0}
.box h3{font-size:18px;margin-bottom:4px}
.box.e{border-inline-start-color:var(--acc)} .box.o{border-inline-start-color:var(--olive)}
.f{display:block}
.f>span{display:block;font-size:13.5px;color:var(--muted);margin-bottom:4px}
.f small.eg{display:block;font-size:12.5px;color:var(--olive);margin-top:3px;font-weight:600}
.g2,.g3,.g4{display:grid;gap:10px;margin-top:10px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}.g4{grid-template-columns:1fr 1fr}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border:0}.kv b{font-weight:700}
.live{position:fixed;bottom:0;inset-inline:0;z-index:3;background:var(--dark);color:var(--dark-fg);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.live b{display:block;font-family:"Reem Kufi",sans-serif;font-size:20px;color:var(--gold)}
.live span{font-size:11.5px;opacity:.75}

/* dock */
.dock{position:fixed;bottom:0;inset-inline:0;z-index:10;background:var(--paper);border-top:1.5px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}
.dock button{padding:10px 0 9px;font-size:12.5px;color:var(--muted);border-top:3px solid transparent;display:flex;flex-direction:column;align-items:center;gap:1px}
.dock button span{font-size:20px}
.dock button[aria-current="page"]{color:var(--acc);border-top-color:var(--acc);font-weight:600}

/* misc */
.btn{background:var(--acc);color:var(--acc-fg);border-radius:10px;padding:12px 20px;font-weight:700}
.btn.alt{background:var(--paper);color:var(--ink);border:1.5px solid var(--line)}
.btn.bad{background:var(--bad);color:#fff}
.btn.sm{padding:7px 14px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.titem{background:var(--paper);border:1.5px solid var(--line);border-inline-start:6px solid var(--gold);border-radius:var(--r);padding:12px 14px;margin:10px 0}
.titem.late{border-inline-start-color:var(--bad)}.titem.done{border-inline-start-color:var(--olive);opacity:.75}
.titem .top{display:flex;justify-content:space-between;gap:8px}
.pill{font-size:12px;padding:2px 10px;border-radius:99px;font-weight:600;background:var(--line)}
.pill.bad{background:var(--bad);color:#fff}.pill.ok{background:var(--olive);color:#fff}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;font-size:13px;color:var(--muted)}
.tags span{background:var(--sand);padding:2px 10px;border-radius:6px}
.empty{padding:28px 10px;text-align:center;color:var(--muted)}
.tbox{overflow-x:auto;border:1.5px solid var(--line);border-radius:var(--r);background:var(--paper);margin-top:12px}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
th,td{padding:9px 8px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--sand);font-size:12.5px;color:var(--muted)}
td small{display:block;color:var(--muted);font-size:11.5px}
td.hot{color:var(--bad);font-weight:700}
.alerts{margin-top:14px;display:grid;gap:8px}
.al{background:var(--paper);border:1.5px solid var(--line);border-inline-start:6px solid var(--gold);border-radius:12px;padding:10px 12px;font-size:14.5px}
.al.bad{border-inline-start-color:var(--bad)}
.al time{display:block;color:var(--muted);font-size:12px}
textarea{min-height:90px;direction:ltr;font-size:13px}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.seg3 button{padding:11px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper)}
.seg3 button[aria-pressed="true"]{background:var(--acc);color:#fff;border-color:var(--acc)}
.foot{text-align:center;color:var(--muted);font-size:13px;margin:28px 0 8px}
.cloudline{font-size:12.5px;opacity:.8;margin-top:10px}
.auth{position:fixed;inset:0;z-index:60;background:var(--sand);overflow:auto;display:grid;place-items:center;padding:20px}
.authcard{width:100%;max-width:420px;background:var(--paper);border:1.5px solid var(--line);border-top:6px solid var(--acc);border-radius:var(--r);padding:20px}
.authcard h1{font-size:28px;color:var(--acc)}
.authcard p{margin:6px 0 16px}
.amsg{min-height:22px;margin-top:10px;font-size:14px;color:var(--bad)}
.lnk{color:var(--acc);text-decoration:underline;padding:6px 0;font-size:14px}
.acct .st{font-size:14px;margin-top:6px}
.acct .st.ok{color:var(--olive)}.acct .st.bad{color:var(--bad)}
</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body>
<div id="app"></div>
<div id="sheetHost"></div>
<div id="authHost"></div>
<nav class="dock" id="dock">
  <button data-tab="prod"><span>🥚</span>الإنتاج</button>
  <button data-tab="treat"><span>💊</span>العلاج</button>
  <button data-tab="log"><span>📒</span>السجل</button>
  <button data-tab="set"><span>⚙️</span>الإعدادات</button>
</nav>

<script>
const HOUSES = 8, TRAY = 30, KEY = "farm-ledger-v1";
const $ = s => document.querySelector(s);
const nf = n => Number(n || 0).toLocaleString("en-US", { maximumFractionDigits: 1 });
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

let store = { days: {}, treat: [] };
try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s) store = Object.assign(store, s); } catch (e) {}
function saveLocal() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
const cloud = { ready: false, user: null, status: "", ok: "" };
function persist() {
  saveLocal(); if (window.cloudPush) window.cloudPush();
  const m = $("#savedmsg"); if (m) { m.textContent = "✓ تم الحفظ"; clearTimeout(persist.t); persist.t = setTimeout(() => m.textContent = "", 1600); }
}
const todayISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const state = { tab: "prod", shift: "day", date: todayISO(), open: null, side: "c", alerts: false };

function dayObj(shift, date = state.date, create = true) {
  if (!store.days[date]) { if (!create) return null; store.days[date] = {}; }
  if (!store.days[date][shift]) { if (!create) return null; store.days[date][shift] = {}; }
  return store.days[date][shift];
}
function houseObj(shift, h, date = state.date, create = true) {
  const d = dayObj(shift, date, create); if (!d) return null;
  if (!d[h]) { if (!create) return null; d[h] = { c: {}, f: {}, h: {} }; }
  return d[h];
}
const v = (o, k) => parseFloat(o && o[k]) || 0;
function calcSide(r) {
  r = r || {};
  const trays = v(r,"c1") + v(r,"c2") + v(r,"c3"), good = trays * TRAY;
  const bad = v(r,"dbl") + v(r,"defect") + v(r,"broken") + v(r,"dead");
  return { target: v(r,"target"), trays, good, bad, total: good + bad, mortM: v(r,"mortM"), mortF: v(r,"mortF"),
    cullM: v(r,"cullM"), cullF: v(r,"cullF"), feed: v(r,"feed"), feedS: v(r,"feedS"), feedE: v(r,"feedE"), birds: v(r,"birds") };
}
const addCalc = (a, b) => { const o = {}; for (const k in a) o[k] = a[k] + b[k]; return o; };
const zero = () => calcSide({});
function houseTotals(shift, h, date = state.date) {
  const ho = houseObj(shift, h, date, false);
  if (!ho) return Object.assign(zero(), { water: 0 });
  const t = addCalc(calcSide(ho.c), calcSide(ho.f)); t.water = v(ho.h, "water"); return t;
}
function dayTotals(shift, date = state.date) {
  let t = Object.assign(zero(), { water: 0 });
  for (let h = 1; h <= HOUSES; h++) t = addCalc(t, houseTotals(shift, h, date));
  return t;
}
const pct = t => t.target ? t.total / t.target * 100 : null;
const pctText = t => pct(t) == null ? "—" : pct(t).toFixed(1) + "%";
function remText(t) {
  if (!t.target) return "—"; const rem = Math.max(0, t.target - t.total); if (!rem) return "0";
  const tr = Math.floor(rem / TRAY), eg = Math.round(rem % TRAY);
  return tr ? `${nf(tr)} طبق${eg ? " و " + eg + " بيضة" : ""}` : `${eg} بيضة`;
}
const gramPer = t => t.birds ? t.feed * 1000 / t.birds : null;
const gramText = t => gramPer(t) == null ? "—" : nf(gramPer(t)) + " جم";
function lastBirds(shift, h, side, date) {
  for (const d of Object.keys(store.days).filter(d => d < date).sort().reverse()) {
    const b = v(((store.days[d][shift] || {})[h] || {})[side], "birds"); if (b) return b;
  }
  return "";
}
function hasData(shift, h) {
  if (shift === "eve") return houseEve(h).any;
  const ho = houseObj(shift, h, state.date, false); if (!ho) return false;
  return ["c","f"].some(s => ["c1","c2","c3","dbl","defect","broken","dead","mortM","mortF","cullM","cullF","feed"].some(k => v(ho[s], k) > 0));
}
const fmtDate = d => { const x = new Date(d + "T12:00:00"); return x.toLocaleDateString("ar-EG", { weekday: "long" }) + " " + `${x.getDate()}/${x.getMonth() + 1}/${x.getFullYear()}`; };

/* ---------- المسائي ---------- */
const HOURS = [18,19,20,21,22,23,0,1,2,3,4,5,6];
const hLabel = h => (h % 12 || 12) + (h >= 12 ? " م" : " ص");
const num = x => { const n = parseFloat(x); return isNaN(n) ? null : n; };
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
function houseEve(h, date = state.date) {
  const ho = houseObj("eve", h, date, false), e = (ho && ho.e) || {};
  const col = k => HOURS.map(x => num((e[k] || {})[x])).filter(n => n !== null);
  const T = col("t"), O = col("o"), F = col("f"), H = col("hum");
  const n = HOURS.filter(x => ["t","o","f","hum"].some(k => num((e[k] || {})[x]) !== null)).length;
  const mx = a => a.length ? Math.max(...a) : null, mn = a => a.length ? Math.min(...a) : null;
  return { avgT: avg(T), minT: mn(T), maxT: mx(T), outT: avg(O), fans: mx(F), fansAvg: avg(F),
    hum: avg(H), min: mn(H), max: mx(H), n, any: n > 0 };
}
function eveDay(date = state.date) {
  const L = Array.from({ length: HOUSES }, (_, i) => houseEve(i + 1, date)), pick = k => L.map(x => x[k]).filter(n => n !== null);
  return { avgT: avg(pick("avgT")), outT: avg(pick("outT")), fans: pick("fans").reduce((a, b) => a + b, 0), hum: avg(pick("hum")), houses: L.filter(x => x.any).length };
}
const dash = (x, f = nf) => x === null || x === undefined ? "—" : f(x);

/* ---------- الحساب والمزامنة ---------- */
const skipped = () => { try { return sessionStorage.getItem("skipAuth") === "1"; } catch (e) { return false; } };
function cloudText() {
  if (!cloud.ready) return "";
  if (!cloud.user) return "☁️ مش مسجل دخول · البيانات على الجهاز ده بس";
  return cloud.status || "☁️ متصل";
}
function authErr(err) {
  const c = (err && err.code) || "";
  return ({ "auth/invalid-credential": "الإيميل أو الباسورد غلط", "auth/wrong-password": "الإيميل أو الباسورد غلط", "auth/user-not-found": "مفيش حساب بالإيميل ده، اضغط إنشاء حساب",
    "auth/email-already-in-use": "الإيميل ده مسجل قبل كده، اضغط دخول", "auth/weak-password": "الباسورد ضعيف، لازم 6 حروف على الأقل", "auth/invalid-email": "الإيميل مكتوب غلط",
    "auth/network-request-failed": "مفيش اتصال بالإنترنت", "auth/too-many-requests": "محاولات كتير، جرب بعد شوية",
    "auth/operation-not-allowed": "فعّل Email/Password من Firebase ← Authentication ← Sign-in method" })[c] || ("حصل خطأ: " + (c || (err && err.message) || ""));
}
const amsg = t => { const m = $("#aMsg"); if (m) m.textContent = t; };
function renderAuth() {
  const host = $("#authHost");
  let mode = "";
  if (cloud.user && cloud.denied) mode = "denied";
  else if (!cloud.user) mode = (cloud.ready || cloud.failed) ? "login" : "loading";
  if (!mode) { host.innerHTML = ""; host.dataset.mode = ""; document.body.style.overflow = state.open ? "hidden" : ""; return; }
  if (host.dataset.mode === mode) return;
  host.dataset.mode = mode;
  if (mode === "loading") host.innerHTML = `<div class="auth"><div class="authcard"><h1>دفتر المزرعة</h1><p class="muted">جارٍ التحميل…</p></div></div>`;
  else if (mode === "denied") host.innerHTML = `<div class="auth"><div class="authcard"><h1>⛔ غير مصرّح</h1>
    <p class="muted">الحساب <b dir="ltr">${esc((cloud.user && cloud.user.email) || "")}</b> مش مضاف في قايمة المستخدمين المسموح لهم. كلّم المسؤول عشان يضيف إيميلك، وبعدها ادخل تاني.</p>
    <div class="row"><button class="btn" id="dLogout">تسجيل الخروج</button></div></div></div>`;
  else host.innerHTML = `<div class="auth"><div class="authcard"><h1>دفتر المزرعة</h1>
    <p class="muted">الدخول متاح للحسابات المصرّح لها بس. سجّل دخولك عشان بياناتك تتحفظ أونلاين.</p>
    <label class="f"><span>الإيميل</span><input type="email" id="aEmail" autocomplete="email" dir="ltr"></label>
    <label class="f" style="margin-top:10px"><span>الباسورد (6 حروف على الأقل)</span><input type="password" id="aPass" autocomplete="current-password" dir="ltr"></label>
    <div id="aMsg" class="amsg"></div>
    <div class="row"><button class="btn" id="aLogin">دخول</button><button class="btn alt" id="aSignup">إنشاء حساب</button></div>
    <div class="row"><button class="lnk" id="aReset">نسيت الباسورد؟</button></div></div></div>`;
  document.body.style.overflow = "hidden";
}
setTimeout(() => { if (!cloud.ready) { cloud.failed = true; renderAuth(); } }, 8000);
function acctInner() {
  if (!cloud.ready) return `<h3>الحساب والمزامنة</h3><div class="small muted">جارٍ تحميل خدمة الحفظ أونلاين… لو فضلت كده اتأكد من الإنترنت.</div>`;
  if (!cloud.user) return `<h3>الحساب والمزامنة</h3><div class="small muted">مش مسجل دخول، فالبيانات على الجهاز ده بس.</div><div class="row"><button class="btn" id="cLogin">تسجيل الدخول</button></div>`;
  return `<h3>الحساب والمزامنة</h3><div class="small"><b dir="ltr">${esc(cloud.user.email || "")}</b></div>
    <div class="st ${cloud.ok}">${esc(cloud.status || "☁️ متصل")}</div>
    <div class="row"><button class="btn" id="cSync">مزامنة الآن</button><button class="btn alt" id="cLogout">تسجيل الخروج</button></div>`;
}
window.onCloud = () => {
  renderAuth();
  const l = $("#cloudLine"); if (l) l.textContent = cloudText();
  const a = $("#acctBox"); if (a) a.innerHTML = acctInner();
};
window.cloudChanged = () => { if (state.open) refreshSheet(); else render(); };

/* ---------- الإنتاج ---------- */
function prodHTML() {
  const ev = state.shift === "eve";
  let cards = "", ringP, ringTxt, big, mini;
  if (ev) {
    const d = eveDay();
    ringP = d.hum || 0; ringTxt = d.hum === null ? "—" : Math.round(d.hum) + "%";
    big = `${dash(d.avgT)} <span style="font-size:18px">°م متوسط</span>`;
    mini = `<div><b>${dash(d.outT)}°</b>خارجية</div><div><b>${nf(d.fans)}</b>مراوح</div><div><b>${d.houses}/${HOUSES}</b>عنابر مسجلة</div>`;

      cards += `<button class="hc ${e.any ? "has" : "empty"}" data-open="${h}">

        <div class="small muted">رطوبة ${e.hum === null ? "—" : Math.round(e.hum) + "%"} · مراوح ${dash(e.fans)}</div>

    }
  } else {
    const t = dayTotals(state.shift), p = pct(t);
    ringP = p || 0; ringTxt = p == null ? "—" : Math.round(p) + "%";

    mini = `<div><b>${nf(t.good)}</b>صالح</div><div><b>${nf(t.bad)}</b>مستبعد</div><div><b>${remText(t)}</b>متبقي</div>`;
    for (let h = 1; h <= HOUSES; h++) {
      const ht = houseTotals(state.shift, h), hp = pct(ht), has = hasData(state.shift, h);
      cards += `<button class="hc ${has ? "has" : "empty"}" data-open="${h}">
        <div class="n">${h}</div><div class="nm">عنبر</div>
        <div class="tr">${nf(ht.trays)} <small>طبق</small></div>

        <div class="pb"><i style="width:${Math.min(100, hp || 0)}%"></i></div></button>`;
    }
  }
  return `
  <header class="hero"><div class="wrap">
    <div class="top"><div><h1>دفتر المزرعة</h1><div class="who">م/ اسلام نادي</div></div>

    <div class="sum"><div class="ring" style="--p:${Math.min(100, ringP)}"><b>${ringTxt}</b></div>
      <div><div class="lbl">${fmtDate(state.date)}${ev ? " · متوسط الرطوبة" : ""}</div><div class="big">${big}</div>
      <div class="mini">${mini}</div></div></div>
  </div></header>
  <div class="wrap">
    <div class="alerts" id="alertBox">${alertsHTML()}</div>
    <div class="sec-t"><h2>العنابر</h2><span class="small muted">اضغط على عنبر للتسجيل</span></div>
    <div class="grid">${cards}</div>

}
function alerts() {
  const out = [], now = new Date();
  store.treat.filter(t => !t.done && treatDT(t) < now).forEach(t => out.push({ c: "bad", t: `علاج متأخر: ${t.name} (${t.house})`, time: t.date.split("-").reverse().join("/") + " " + (t.time || "") }));
  { const t = dayTotals("day", todayISO()), p = pct(t);
    if (p != null && t.total && p < 90) out.push({ c: "warn", t: `الإنتاج ${p.toFixed(1)}% من المطلوب (النهاري)`, time: "النهارده" }); }
  return out;
}
function alertsHTML() {
  if (!state.alerts) return ""; const a = alerts();
  return a.length ? a.map(x => `<div class="al ${x.c}">${esc(x.t)}<time>${x.time}</time></div>`).join("") : '<div class="al">مفيش تنبيهات دلوقتي.</div>';
}

/* ---------- شاشة العنبر ---------- */
const fld = (label, k, r, step = "1", extra = "") => `<label class="f"><span>${label}</span><input type="number" inputmode="decimal" step="${step}" data-k="${k}" ${extra} value="${r && r[k] !== undefined && r[k] !== "" ? r[k] : ""}"></label>`;
function kvHTML(t) {
  return [["البيض المطلوب", nf(t.target)], ["الصالح (بيضة)", nf(t.good)], ["المستبعد (بيضة)", nf(t.bad)], ["الإجمالي (بيضة)", nf(t.total)],
    ["النسبة من المطلوب", pctText(t)], ["متبقي للجمع", remText(t)], ["الأطباق", nf(t.trays)], ["نفوق (ديوك + دجاج)", nf(t.mortM) + " + " + nf(t.mortF)],
    ["فرز (ديوك + دجاج)", nf(t.cullM) + " + " + nf(t.cullF)], ["العلف (كجم)", nf(t.feed)], ["علف بداية / نهاية اليوم", nf(t.feedS) + " / " + nf(t.feedE)],
    ["عدد الفراخ", nf(t.birds)], ["العلف للفرخة", gramText(t)], ["المياه (لتر)", nf(t.water)]]
    .map(([a, b]) => `<div class="kv"><span>${a}</span><b>${b}</b></div>`).join("");
}

  const h = state.open, ho = houseObj("eve", h); ho.e = ho.e || {};

    <div class="box e" style="margin-bottom:0"><h3>قراءات كل ساعة</h3><div class="small muted">من ٦ مساءً لحد ٦ صباحًا (${HOURS.length} قراءة). في كل ساعة: الحرارة، والحرارة الخارجية، وعدد المراوح، والرطوبة.</div></div>
    ${HOURS.map(x => `<div class="box"><h3>🕐 ${hLabel(x)}</h3><div class="g2">
      ${inp("t", x, "متوسط الحرارة °م", "0.1")}${inp("o", x, "الحرارة الخارجية °م", "0.1")}${inp("f", x, "عدد المراوح", "1")}${inp("hum", x, "الرطوبة %", "0.1")}</div></div>`).join("")}
    <div class="box e"><h3>ملخص عنبر ${h}</h3><div id="humSum"></div></div>
    <div class="box e"><h3>متوسط المزرعة (كل العنابر)</h3><div id="farmEve"></div></div>
  </div>
  <div class="live" id="live"></div></div>`;
}
function refreshEve() {

  $("#humSum").innerHTML = kv("متوسط الحرارة", dg(e.avgT)) + kv("أقل / أعلى حرارة", dg(e.minT) + " / " + dg(e.maxT)) + kv("متوسط الخارجية", dg(e.outT))
    + kv("أقصى عدد مراوح", dash(e.fans)) + kv("متوسط المراوح", dash(e.fansAvg)) + kv("متوسط الرطوبة", pc(e.hum)) + kv("أقل / أعلى رطوبة", dash(e.min, x => x + "%") + " / " + dash(e.max, x => x + "%"))
    + kv("الساعات المسجلة", e.n + " من " + HOURS.length);

  $("#live").innerHTML = `<div><b>${dg(e.avgT)}</b><span>متوسط الحرارة</span></div><div><b>${dg(e.outT)}</b><span>خارجية</span></div><div><b>${dash(e.fans)}</b><span>أقصى مراوح</span></div><div><b>${e.hum === null ? "—" : Math.round(e.hum) + "%"}</b><span>رطوبة</span></div>`;

function sheetHTML() {

    <div class="box o"><h3>العلف</h3><div class="g2">${fld("العلف (كجم)","feed",r)}${fld("عدد الفراخ","birds",r)}${fld("علف بداية اليوم (كجم)","feedS",r)}${fld("علف نهاية اليوم (كجم)","feedE",r)}</div></div>
    <div class="box"><h3>بيانات العنبر كله</h3><div class="small muted">موحدة للجانبين.</div><div class="g3">${fld("حرارة عظمى °م","tmax",ho.h,"0.1","data-hk")}${fld("حرارة صغرى °م","tmin",ho.h,"0.1","data-hk")}${fld("المياه (لتر)","water",ho.h,"1","data-hk")}</div></div>
    <div class="box e"><h3>إجمالي عنبر ${h} (الجانبين)</h3><div id="hTot"></div></div>
    <div class="box e"><h3>إجمالي المزرعة</h3><div id="dTot"></div></div>

function refreshSheet() {
  if (state.shift === "eve") return refreshEve();
  const sh = state.shift, ho = houseObj(sh, state.open), c = calcSide(ho[state.side]), ht = houseTotals(sh, state.open);

}
function showSheet() {
  $("#sheetHost").innerHTML = state.open ? sheetHTML() : "";
  document.body.style.overflow = state.open ? "hidden" : "";
  if (state.open) refreshSheet();
}

const treatDT = t => new Date(t.date + "T" + (t.time || "00:00"));
function treatHTML() {
  const list = store.treat.slice().sort((a, b) => treatDT(a) - treatDT(b)), now = new Date();
  const opts = `<option>كل العنابر</option>` + Array.from({ length: HOUSES }, (_, i) => `<option>عنبر ${i + 1}</option>`).join("");

  <div class="box e"><h3>إضافة علاج</h3>
    <label class="f"><span>اسم العلاج</span><input id="tName" placeholder="مثال: فيتامينات"></label>
    <div class="g2"><label class="f"><span>العنبر</span><select id="tHouse">${opts}</select></label><label class="f"><span>الجرعة</span><input id="tDose" placeholder="مثال: 1 لتر / 1000 لتر"></label>
    <label class="f"><span>التاريخ</span><input type="date" id="tDate" value="${state.date}"></label><label class="f"><span>الوقت</span><input type="time" id="tTime" value="08:00"></label></div>
    <div class="row"><button class="btn" id="tAdd">إضافة</button></div></div>

    return `<div class="titem ${late ? "late" : ""} ${t.done ? "done" : ""}"><div class="top"><b>${esc(t.name)}</b>${late ? '<span class="pill bad">متأخر</span>' : t.done ? '<span class="pill ok">تم</span>' : '<span class="pill">قادم</span>'}</div>
      <div class="tags"><span>${esc(t.house)}</span>${t.dose ? `<span>${esc(t.dose)}</span>` : ""}<span>${t.date.split("-").reverse().join("/")} ${t.time || ""}</span></div>
      <div class="row" style="margin-top:4px"><button class="btn sm" data-tdone="${t.id}">${t.done ? "تراجع" : "تم"}</button><button class="btn sm bad" data-tdel="${t.id}">حذف</button></div></div>`; }).join("")
    : '<div class="empty">مفيش علاجات متسجلة لسه.</div>'}</div>`;
}

/* ---------- السجل ---------- */
function logHTML() {
  const rows = [];
  Object.keys(store.days).sort().reverse().forEach(date => ["day", "eve"].forEach(sh => {
    if (sh === "eve" || !store.days[date][sh]) return; const t = dayTotals(sh, date);
    if (!(t.total || t.mortM || t.mortF || t.feed || t.water || t.target)) return;
    const p = pct(t), br = t.total ? t.bad / t.total : 0;
    rows.push(`<tr data-date="${date}" data-sh="${sh}" style="cursor:pointer"><td>${date.split("-").reverse().join("/")}<small>${sh === "day" ? "نهاري" : "مسائي"}</small></td><td>${nf(t.good)}</td><td class="${br > 0.05 ? "hot" : ""}">${nf(t.bad)}</td><td>${nf(t.total)}</td><td>${nf(t.trays)}</td><td class="${p != null && p < 90 ? "hot" : ""}">${pctText(t)}</td><td>${nf(t.mortM + t.mortF)}</td><td>${nf(t.cullM + t.cullF)}</td><td>${nf(t.feed)}</td><td>${gramText(t)}</td><td>${nf(t.water)}</td></tr>`);
  }));
  const erows = Object.keys(store.days).sort().reverse().map(date => { const d = eveDay(date); if (!d.houses) return "";
    let n = 0; for (let h = 1; h <= HOUSES; h++) n += houseEve(h, date).n;
    return `<tr data-date="${date}" data-sh="eve" style="cursor:pointer"><td>${date.split("-").reverse().join("/")}</td><td>${dash(d.avgT)}</td><td>${dash(d.outT)}</td><td>${nf(d.fans)}</td><td>${d.hum === null ? "—" : d.hum.toFixed(1) + "%"}</td><td>${n}</td></tr>`; }).filter(Boolean);
  const eveTable = erows.length ? `<div class="sec-t"><h2>المسائي</h2></div><div class="tbox"><table style="min-width:480px"><thead><tr><th>اليوم</th><th>متوسط الحرارة</th><th>الخارجية</th><th>المراوح</th><th>متوسط الرطوبة</th><th>القراءات</th></tr></thead><tbody>${erows.join("")}</tbody></table></div>` : "";
  return `<div class="wrap"><div class="sec-t"><h2>السجل · النهاري</h2><span class="small muted">اضغط على صف لفتح اليوم</span></div>
  ${rows.length ? `<div class="tbox"><table><thead><tr><th>اليوم</th><th>الصالح</th><th>المستبعد</th><th>الإجمالي</th><th>الأطباق</th><th>النسبة</th><th>النفوق</th><th>الفرز</th><th>العلف</th><th>جم/فرخة</th><th>المياه</th></tr></thead><tbody>${rows.join("")}</tbody></table></div>` : '<div class="empty">لسه مفيش بيانات نهاري مسجلة.</div>'}${eveTable}</div>`;
}

document.addEventListener("click", e => {
  const t = e.target.closest("button, tr[data-date]"); if (!t) return;
  if (t.id === "aLogin" || t.id === "aSignup") {
    const em = $("#aEmail").value.trim(), pw = $("#aPass").value;
    if (!em || !pw) return amsg("اكتب الإيميل والباسورد");
    if (!window.cloudApi) return amsg("الخدمة مش متاحة، اتأكد من الإنترنت");
    amsg("جارٍ التحقق…"); window.cloudApi[t.id === "aLogin" ? "login" : "signup"](em, pw).catch(err => amsg(authErr(err))); return;
  }
  if (t.id === "aReset") {
    const em = $("#aEmail").value.trim(); if (!em) return amsg("اكتب الإيميل الأول");
    if (!window.cloudApi) return amsg("الخدمة مش متاحة، اتأكد من الإنترنت");
    window.cloudApi.reset(em).then(() => amsg("اتبعتلك رسالة على الإيميل لتغيير الباسورد"), err => amsg(authErr(err))); return;
  }
  if (t.id === "aSkip") { try { sessionStorage.setItem("skipAuth", "1"); } catch (x) {} renderAuth(); return; }
  if (t.id === "dLogout") { if (window.cloudApi) window.cloudApi.logout(); return; }
  if (t.id === "cLogin") { try { sessionStorage.removeItem("skipAuth"); } catch (x) {} renderAuth(); return; }
  if (t.id === "cSync") { if (window.cloudPushNow) window.cloudPushNow(); return; }
  if (t.id === "cLogout") { if (confirm("تسجيل الخروج هيمسح نسخة البيانات من الجهاز ده، وهتفضل محفوظة أونلاين. متأكد؟")) window.cloudApi.logout(); return; }
  if (t.dataset.tab) { state.tab = t.dataset.tab; state.open = null; window.scrollTo(0, 0); return render(); }
  if (t.dataset.shift) { state.shift = t.dataset.shift; return render(); }
  if (t.dataset.open) { state.open = +t.dataset.open; return showSheet(); }
  if (t.id === "back") { state.open = null; return render(); }
  if (t.dataset.side) { state.side = t.dataset.side; return showSheet(); }
  if (t.id === "bell") { state.alerts = !state.alerts; $("#alertBox").innerHTML = alertsHTML(); return; }
  if (t.dataset.date) { state.date = t.dataset.date; state.shift = t.dataset.sh; state.tab = "prod"; return render(); }
  if (t.id === "tAdd") { const name = $("#tName").value.trim(); if (!name) return alert("اكتب اسم العلاج الأول");
    store.treat.push({ id: Date.now(), name, house: $("#tHouse").value, dose: $("#tDose").value.trim(), date: $("#tDate").value || state.date, time: $("#tTime").value, done: false }); persist(); return render(); }
  if (t.dataset.tdone) { const x = store.treat.find(i => i.id == t.dataset.tdone); x.done = !x.done; persist(); return render(); }
  if (t.dataset.tdel) { store.treat = store.treat.filter(i => i.id != t.dataset.tdel); persist(); return render(); }
  if (t.id === "bkCopy") { const s = JSON.stringify(store); (navigator.clipboard ? navigator.clipboard.writeText(s) : Promise.reject()).then(() => alert("تم نسخ البيانات"), () => { $("#bk").value = s; $("#bk").select(); }); return; }
  if (t.id === "bkRestore") { try { const s = JSON.parse($("#bk").value); if (!s.days) throw 0; store = Object.assign({ days: {}, treat: [] }, s); persist(); render(); alert("تمت الاستعادة"); } catch (x) { alert("النسخة الاحتياطية غير صالحة"); } return; }
  if (t.id === "wipe") { if (confirm("هتتمسح كل البيانات نهائيًا، من الجهاز ومن الأونلاين لو مسجل دخول. متأكد؟")) { store = { days: {}, treat: [] }; persist(); render(); } }
});
document.addEventListener("input", e => {
  const i = e.target; if (!state.open || !i.dataset) return;
  if (state.shift === "eve" && i.dataset.hr) {
    const ho = houseObj("eve", state.open); ho.e = ho.e || {}; ho.e[i.dataset.hr] = ho.e[i.dataset.hr] || {};
    ho.e[i.dataset.hr][i.dataset.hour] = i.value; persist(); return refreshEve();
  }
  if (!i.dataset.k) return;
  const ho = houseObj(state.shift, state.open); (i.hasAttribute("data-hk") ? ho.h : ho[state.side])[i.dataset.k] = i.value;
  persist(); refreshSheet();
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "aPass") $("#aLogin").click(); });
document.addEventListener("change", e => { if (e.target.id === "dDate" && e.target.value) { state.date = e.target.value; render(); } });
render();
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, getFirestore, doc, collection, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBnDRHkXBaAQK2nO6jJm5i3HCr-f4VLk2w",
  authDomain: "farm-d0ea1.firebaseapp.com",
  projectId: "farm-d0ea1",
  storageBucket: "farm-d0ea1.firebasestorage.app",
  messagingSenderId: "528211560917",
  appId: "1:528211560917:web:386924c5ac159c59a2955c"
};
const app = initializeApp(firebaseConfig), auth = getAuth(app);
let db; try { db = initializeFirestore(app, { localCache: persistentLocalCache() }); } catch (e) { db = getFirestore(app); }

let uid = null, unsubs = [], synced = {}, treatSynced = null, timer = null;
const meaningful = o => o && typeof o === "object" ? Object.values(o).some(meaningful) : (o !== undefined && o !== null && o !== "");
const setStatus = (t, ok = "") => { cloud.status = t; cloud.ok = ok; window.onCloud(); };

async function push() {
  if (!uid) return; const me = uid;
  setStatus("⏳ جارٍ الرفع…");
  try {
    const jobs = [];
    for (const date of Object.keys(store.days)) {
      const j = JSON.stringify(store.days[date]);
      if (synced[date] === j) continue;
      if (synced[date] === undefined && !meaningful(store.days[date])) continue;
      jobs.push(setDoc(doc(db, "users", me, "days", date), { json: j, ts: Date.now() }).then(() => { synced[date] = j; }));
    }
    for (const date of Object.keys(synced)) if (!store.days[date]) jobs.push(deleteDoc(doc(db, "users", me, "days", date)).then(() => { delete synced[date]; }));
    const tj = JSON.stringify(store.treat || []);
    if (tj !== treatSynced && !(treatSynced === null && tj === "[]")) jobs.push(setDoc(doc(db, "users", me, "meta", "treat"), { json: tj, ts: Date.now() }).then(() => { treatSynced = tj; }));
    await Promise.all(jobs);
    setStatus("☁️ تم الرفع " + new Date().toLocaleTimeString("ar-EG", { hour: "2-digit", minute: "2-digit" }), "ok");
  } catch (e) { onErr(e); }
}
window.cloudPush = () => { if (!uid || cloud.denied) return; clearTimeout(timer); timer = setTimeout(push, 1800); cloud.status = "⏳ جارٍ الحفظ…"; cloud.ok = ""; const l = document.querySelector("#cloudLine"); if (l) l.textContent = cloud.status; };
window.cloudPushNow = () => { clearTimeout(timer); return push(); };
window.addEventListener("online", () => { if (uid) window.cloudPushNow(); });

function onErr(err) {
  if ((err.code || "") === "permission-denied") { cloud.denied = true; clearTimeout(timer); window.onCloud(); }
  else setStatus("⚠️ مشكلة في المزامنة: " + (err.code || err.message), "bad");
}
function startSync(u) {
  uid = u.uid; synced = {}; treatSynced = null;
  unsubs.push(onSnapshot(collection(db, "users", uid, "days"), snap => {
    let changed = false;
    snap.docChanges().forEach(ch => {
      const date = ch.doc.id, local = store.days[date] ? JSON.stringify(store.days[date]) : null;
      const unsynced = local !== null && meaningful(store.days[date]) && synced[date] !== local;
      if (ch.type === "removed") { if (local !== null && !unsynced) { delete store.days[date]; changed = true; } delete synced[date]; return; }
      const j = ch.doc.data().json;
      if (local === j) { synced[date] = j; return; }
      if (unsynced) return;
      store.days[date] = JSON.parse(j); synced[date] = j; changed = true;
    });
    if (changed) { saveLocal(); window.cloudChanged(); }
    if (!snap.metadata.hasPendingWrites && cloud.ok !== "bad" && !/جارٍ/.test(cloud.status)) setStatus(cloud.status && cloud.status.includes("تم الرفع") ? cloud.status : "☁️ متصل ومتزامن", "ok");
  }, onErr));
  unsubs.push(onSnapshot(doc(db, "users", uid, "meta", "treat"), s => {
    if (!s.exists()) return;
    const j = s.data().json, remote = JSON.parse(j), mine = store.treat || [], local = JSON.stringify(mine);
    if (local === j) { treatSynced = j; return; }
    if (mine.length && treatSynced !== local) {
      if (treatSynced === null) { const m = new Map(); remote.concat(mine).forEach(t => m.set(t.id, t)); store.treat = [...m.values()]; saveLocal(); window.cloudChanged(); window.cloudPush(); }
      treatSynced = treatSynced === null ? "" : treatSynced; return;
    }
    store.treat = remote; treatSynced = j; saveLocal(); window.cloudChanged();
  }, onErr));
  window.cloudPush();
}
function stopSync() { unsubs.forEach(f => f()); unsubs = []; uid = null; synced = {}; treatSynced = null; clearTimeout(timer); }

window.cloudApi = {
  login: (e, p) => signInWithEmailAndPassword(auth, e, p),
  signup: (e, p) => createUserWithEmailAndPassword(auth, e, p),
  reset: e => sendPasswordResetEmail(auth, e),
  logout: async () => {
    try { await Promise.race([window.cloudPushNow(), new Promise(r => setTimeout(r, 4000))]); } catch (e) {}
    stopSync(); store.days = {}; store.treat = []; saveLocal();
    await signOut(auth); window.cloudChanged();
  }
};
onAuthStateChanged(auth, u => {
  cloud.ready = true; cloud.denied = false; cloud.user = u ? { email: u.email } : null; cloud.status = u ? "⏳ جارٍ الاتصال…" : ""; cloud.ok = "";
  if (u) startSync(u); else stopSync();
  window.onCloud();
});
</script>
